experiment:
  name: jobbench_grpo
  project: NorthRL-JobBench

models:
  actor:
    name: ${oc.env:NORTHRL_JOBBENCH_ACTOR}
    tokenizer: ${oc.env:NORTHRL_JOBBENCH_TOKENIZER,${models.actor.name}}
    lora:
      enabled: false

data:
  train:
    files:
      - ${oc.env:NORTHRL_JOBBENCH_DATA_DIR}/jobbench.jsonl
    batch_size: 1
    rollout_repeat_n: 4
    prompt_key: instruction
    filter_prompts: false
    shuffle: false
    drop_last: false
  max_prompt_length: 24576
  max_sequence_length: 32768

validate:
  enabled: false

algorithm:
  type: grpo
  sampling_logprob_source: inference
  optim:
    lr: 1.0e-6
    mini_batch_size: 4
  entropy_coeff: 0.0

rollout:
  type: e2b
  num_workers: 4
  max_concurrent_requests: 4
  sampling:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 8192
  execution:
    volume_mounts:
      /mnt/data: ${oc.env:NORTHRL_JOBBENCH_REFERENCE_VOLUME}
    input_fields: [instruction, task_key, task_sha256, rubrics_sha256, max_turns]
    preparation_timeout_seconds: 600
    agent_timeout_seconds: 3600
    evaluation_timeout_seconds: 1800
    entrypoint:
      target: ${oc.env:NORTHRL_PATH}/northrl/rollout_entrypoints/jobbench/entrypoint.py
      task_files_root: ${oc.env:NORTHRL_JOBBENCH_DATA_DIR}/evaluation

training:
  total_steps: 1
  weight_sync:
    mode: sync
  save:
    dir: ${oc.env:EXPERIMENT_PATH}/ckpt

backend:
  type: weaver

runtime:
  logger:
    backends: [console]
  debug:
    enable_data_dump: true
    dump_dir: ${oc.env:EXPERIMENT_PATH}
