experiment:
  name: sft_quickstart
  project: NorthRL-SFT-Quickstart
  seed: 42

models:
  actor:
    name: ${oc.env:SFT_MODEL,Qwen/Qwen3.5-0.8B:262144}
    # Raw `messages` rows are rendered and tokenized with this tokenizer.
    tokenizer: ${oc.env:SFT_TOKENIZER,Qwen/Qwen3.5-0.8B}
    lora:
      enabled: false

data:
  train:
    files:
      - ${oc.env:SFT_DATA_PATH}
    # Token budget per optimizer step = max_sequence_length * batch_size.
    batch_size: ${oc.decode:${oc.env:SFT_BATCH_SIZE,4}}
    # Close after this many samples even when the token budget is not full.
    window_samples: ${oc.decode:${oc.env:SFT_BATCH_SIZE,4}}
    shuffle: ${oc.decode:${oc.env:SFT_SHUFFLE,true}}
    drop_last: true

  # SFT uses one sequence limit for truncation and token-budget batching.
  max_sequence_length: ${oc.decode:${oc.env:SFT_MAX_LENGTH,4096}}

validate:
  # SFT currently has no sampler-backed validation path.
  enabled: false

algorithm:
  type: sft
  # Cross-entropy is also the default loss for SFT.
  loss:
    mode: cross_entropy
    reduction:
      mode: token_mean
  optim:
    lr: ${oc.decode:${oc.env:SFT_LR,1.0e-5}}

# Deliberately omit `rollout`: SFT reads supervised data instead of sampling.
training:
  epochs: ${oc.decode:${oc.env:SFT_EPOCHS,1}}
  save:
    every_n_steps: 0
    final: true
    dir: ${oc.env:EXPERIMENT_PATH}/ckpt

  # Deliberately omit weight_sync: SFT derives mode=no-sync.

backend:
  type: weaver
  # Credentials come from WEAVER_BASE_URL / WEAVER_API_KEY, never from this file.
  metrics_store:
    path: ${oc.env:EXPERIMENT_PATH}/weaver-metrics

runtime:
  # Console-only keeps the first run independent of W&B credentials.
  logger:
    backends: [console]
  progress:
    log_every_n_steps: 1
