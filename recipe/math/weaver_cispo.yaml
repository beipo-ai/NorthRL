experiment:
  name: weaver-cispo_single_turn_math_qwen3_8b
  project: NorthRL-weaver
  seed: 42

models:
  actor:
    name: "Qwen/Qwen3-8B"
    tokenizer: null                            # null = weaver_service_holder 内部 fallback 到 training_client.get_tokenizer()
    checkpoint: null
    lora:
      enabled: true
      rank: 32

data:
  train:
    files:
      - ${oc.env:NORTHRL_DATA_PATH}/math/level1_train.parquet
      - ${oc.env:NORTHRL_DATA_PATH}/math/level2_train.parquet
      - ${oc.env:NORTHRL_DATA_PATH}/math/level3_train.parquet
      - ${oc.env:NORTHRL_DATA_PATH}/math/level4_train.parquet
      - ${oc.env:NORTHRL_DATA_PATH}/math/level5_train.parquet
    batch_size: 32
    rollout_repeat_n: 8
    prompt_key: prompt
    filter_prompts: false
    shuffle: true
    drop_last: true

  max_prompt_length: 4096
  max_sequence_length: 12288

validate:
  enabled: true
  data:
    datasets:
      math:
        files:
          - ${oc.env:NORTHRL_DATA_PATH}/math/level1_test.parquet
          - ${oc.env:NORTHRL_DATA_PATH}/math/level2_test.parquet
          - ${oc.env:NORTHRL_DATA_PATH}/math/level3_test.parquet
          - ${oc.env:NORTHRL_DATA_PATH}/math/level4_test.parquet
          - ${oc.env:NORTHRL_DATA_PATH}/math/level5_test.parquet
        batch_size: 256
  sampling:
    temperature: 0.0                           # greedy evaluation
    top_p: 1.0
    top_k: 1
    min_p: 0.0
  schedule:
    before_train: false
    every_n_steps: 0                           # Disable periodic evaluation

algorithm:
  type: grpo
  advantage:
    estimator: {mode: grpo, params: {norm_adv_by_std: true}}
  loss:
    mode: cispo
    params:
      clip:
        ratio: 0.2
    reduction:
      mode: token_mean
  sampling_logprob_source: recomputed

  optim:
    lr: 1.0e-4
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    weight_decay: 0.01
    grad_clip_norm: 1.0
    batch_size: 32
    mini_batch_size: 16
    submit_ahead: 0

  entropy_coeff: 0.0

  kl:
    mode: null

rollout:
  # rollout worker coroutine 数量。
  num_workers: 256
  # 同时打到 Weaver sampler 的请求上限。null 表示等于 num_workers；
  # 如果 sampler 压力大，可以设得比 num_workers 小。
  max_concurrent_requests: null

  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    stop: []
    min_tokens: 0
    # max_tokens 不写：派生 = data.max_sequence_length - data.max_prompt_length = 8192

  generation_extra: {}

  parsers:
    tool: null
    reasoning: null

  reward_fn: math_with_format
  type: single_turn

training:
  total_steps: 100

  save:
    every_n_steps: 0                           # 0 = 不周期 save
    dir: ${oc.env:EXPERIMENT_PATH}/ckpt

  resume:
    mode: disable
    path: ""
    skip_dataloader: true

  weight_sync:
    mode: sync
    staleness_threshold: 0
    freeze_inflight: true
    sampler_ttl_s: 86400

backend:
  type: weaver
  base_url: null                               # ENV WEAVER_BASE_URL 必填；yaml 仅在 env 未设时作 fallback
  api_key: null                                # ENV WEAVER_API_KEY 必填；yaml 仅在 env 未设时作 fallback
  max_retries: 3
  request_timeout_s: 1000

runtime:
  logger:
    backends: [console, wandb]
    feishu:
      enabled: false
      url: ${oc.env:FEISHU_WEBHOOK_URL,}

  health:
    exception_policy: stop_on_error
    exception_check_interval_s: 1.0

  progress:
    update_interval_s: 1.0
    log_every_n_steps: 10
    use_tqdm: true

  debug:
    enable_data_dump: false
    dump_dir: null
