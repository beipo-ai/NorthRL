experiment:
  name: atc_v3_claude_grpo
  project: NorthRL-ATC-v3
  seed: 42

models:
  actor:
    # Use a model registered on your Weaver service and its matching tokenizer.
    name: ${oc.env:NORTHRL_ATC_MODEL}
    tokenizer: ${oc.env:NORTHRL_ATC_TOKENIZER}
    lora:
      enabled: false

data:
  train:
    files: ["${oc.env:NORTHRL_ATC_TRAIN_DATA}"]
    batch_size: 8
    rollout_repeat_n: 8
    prompt_key: instruction
    filter_prompts: false
    shuffle: true
    drop_last: false
  max_prompt_length: 65536
  max_sequence_length: 262144

validate:
  enabled: false

algorithm:
  type: grpo
  loss:
    mode: importance_sampling
  sampling_logprob_source: inference
  optim:
    lr: 1.0e-6
    batch_size: null
    mini_batch_size: 16
  entropy_coeff: 0.0

rollout:
  type: e2b
  num_workers: 8
  max_concurrent_requests: 8
  keep_sampling_mask: false
  sampling:
    temperature: 0.6
    top_p: 0.95
    top_k: -1
    min_p: 0.0
    max_tokens: 8192
  execution:
    volume_mounts:
      /mnt/data: ${oc.env:NORTHRL_ATC_VOLUME}
    input_fields: [task_id, instruction, asset_path, asset_bundles, task_sha256, agent, max_turns]
    agent_timeout_seconds: 3600
    env_error_retries: 0
    entrypoint:
      target: ${oc.env:NORTHRL_PATH}/northrl/rollout_entrypoints/atc_v3_rollout.py
      workspace: /workspace/atc
      task_files_root: ${oc.env:NORTHRL_ATC_EVALUATION_ROOT}

training:
  total_steps: ${oc.decode:${oc.env:NORTHRL_ATC_TOTAL_STEPS,10}}
  save:
    every_n_steps: 0
    dir: ${oc.env:EXPERIMENT_PATH}/ckpt
  weight_sync:
    mode: sync
    staleness_threshold: 0
    freeze_inflight: true
    sampler_ttl_s: ${oc.decode:${oc.env:NORTHRL_SAMPLER_TTL_S,604800}}

backend:
  type: weaver
  max_retries: 3

runtime:
  logger:
    backends: [console]
  debug:
    enable_data_dump: true
    dump_dir: ${oc.env:EXPERIMENT_PATH}
    dump_every_n_steps: 1
