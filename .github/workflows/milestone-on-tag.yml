name: "Milestone: Auto-assign on Tag"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Assign milestone to PRs and linked issues
        uses: actions/github-script@v7
        env:
          CROSS_REPOSITORY_ISSUES: ${{ secrets.ISSUE_AUTOMATION_TOKEN != '' || secrets.PROJECT_TOKEN != '' }}
        with:
          github-token: ${{ secrets.ISSUE_AUTOMATION_TOKEN || secrets.PROJECT_TOKEN || github.token }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`🏷️ Tag pushed: ${tag} in ${owner}/${repo}`);

            // Skip dev/pre-release tags
            if (tag.includes('dev') || tag.includes('rc') || tag.includes('alpha') || tag.includes('beta') || tag.includes('post')) {
              console.log('Skipping dev/pre-release tag');
              return;
            }

            // 1. Get or create milestone
            const milestones = await github.rest.issues.listMilestones({
              owner, repo, state: 'all', per_page: 100
            });
            let milestone = milestones.data.find(m => m.title === tag);

            if (!milestone) {
              const created = await github.rest.issues.createMilestone({
                owner, repo, title: tag
              });
              milestone = created.data;
              console.log(`📌 Created milestone "${tag}"`);
            } else {
              console.log(`📌 Found existing milestone "${tag}" (#${milestone.number})`);
            }

            // 2. Find previous tag to determine range
            const tags = await github.rest.repos.listTags({ owner, repo, per_page: 50 });
            const tagNames = tags.data.map(t => t.name);
            const currentIdx = tagNames.indexOf(tag);

            // Find previous non-dev release tag
            let prevTag = null;
            for (let i = currentIdx + 1; i < tagNames.length; i++) {
              const t = tagNames[i];
              if (!t.includes('dev') && !t.includes('rc') && !t.includes('alpha') && !t.includes('beta') && !t.includes('post')) {
                prevTag = t;
                break;
              }
            }

            console.log(`📊 Range: ${prevTag || '(beginning)'} → ${tag}`);

            // 3. Get commits in range
            let commits;
            if (prevTag) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${prevTag}...${tag}`
              });
              commits = comparison.data.commits.map(c => c.sha);
            } else {
              // No previous tag, get all commits up to this tag
              const allCommits = await github.rest.repos.listCommits({
                owner, repo, sha: tag, per_page: 100
              });
              commits = allCommits.data.map(c => c.sha);
            }

            console.log(`📝 Found ${commits.length} commits in range`);

            // 4. Find all merged PRs in this range
            const mergedPRs = new Set();
            for (const sha of commits) {
              try {
                const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: sha
                });
                for (const pr of prs.data) {
                  if (pr.merged_at) {
                    mergedPRs.add(pr.number);
                  }
                }
              } catch (e) {
                // Some commits may not have associated PRs
              }
            }

            console.log(`🔀 Found ${mergedPRs.size} merged PRs`);

            // 5. Assign milestone to PRs and their linked issues
            let updated = 0;
            const linkedIssues = new Set();

            for (const prNumber of mergedPRs) {
              // Set milestone on PR
              try {
                const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                if (!pr.data.milestone || pr.data.milestone.title !== tag) {
                  await github.rest.issues.update({
                    owner, repo, issue_number: prNumber, milestone: milestone.number
                  });
                  console.log(`✅ PR #${prNumber}: milestone → ${tag}`);
                  updated++;
                }

                // Parse linked issues from PR body
                const body = pr.data.body || '';
                const patterns = [
                  /(?:closes?|fixes?|resolves?|refs?)\s+(?:([a-zA-Z0-9_.-]+)\/([a-zA-Z0-9_.-]+))?#(\d+)/gi,
                  /(?:closes?|fixes?|resolves?|refs?)\s+https:\/\/github\.com\/([^/]+)\/([^/]+)\/issues\/(\d+)/gi
                ];
                for (const pattern of patterns) {
                  let match;
                  while ((match = pattern.exec(body)) !== null) {
                    const issueOwner = match[1] || owner;
                    const issueRepo = match[2] || repo;
                    const issueNumber = parseInt(match[3]);
                    linkedIssues.add(`${issueOwner}/${issueRepo}#${issueNumber}`);
                  }
                }
              } catch (e) {
                console.log(`❌ PR #${prNumber}: ${e.message}`);
              }
            }

            // 6. Also find closed issues in this repo without milestone
            const closedIssues = await github.rest.issues.listForRepo({
              owner, repo, state: 'closed', per_page: 100, sort: 'updated', direction: 'desc'
            });

            for (const issue of closedIssues.data) {
              if (issue.pull_request) continue; // Skip PRs
              if (issue.milestone && issue.milestone.title === tag) continue;
              if (!issue.milestone) {
                // Check if this issue was closed by a PR in our range
                const timeline = await github.rest.issues.listEventsForTimeline({
                  owner, repo, issue_number: issue.number, per_page: 50
                });
                const closedByPR = timeline.data.find(
                  e => e.event === 'cross-referenced' && e.source?.issue?.pull_request && mergedPRs.has(e.source.issue.number)
                );
                if (closedByPR) {
                  linkedIssues.add(`${owner}/${repo}#${issue.number}`);
                }
              }
            }

            // 7. Set milestone on linked issues (including cross-repo)
            for (const ref of linkedIssues) {
              const [fullRepo, num] = ref.split('#');
              const [iOwner, iRepo] = fullRepo.split('/');
              const iNumber = parseInt(num);

              const sameRepo = fullRepo.toLowerCase() === `${owner}/${repo}`.toLowerCase();
              if (!sameRepo && process.env.CROSS_REPOSITORY_ISSUES !== 'true') {
                console.log(`Skipping ${ref}: cross-repository updates require ISSUE_AUTOMATION_TOKEN (or legacy PROJECT_TOKEN)`);
                continue;
              }

              try {
                // Get or create milestone in that repo
                const repoMilestones = await github.rest.issues.listMilestones({
                  owner: iOwner, repo: iRepo, state: 'all', per_page: 100
                });
                let repoMs = repoMilestones.data.find(m => m.title === tag);
                if (!repoMs) {
                  const created = await github.rest.issues.createMilestone({
                    owner: iOwner, repo: iRepo, title: tag
                  });
                  repoMs = created.data;
                  console.log(`📌 Created milestone "${tag}" in ${iOwner}/${iRepo}`);
                }

                await github.rest.issues.update({
                  owner: iOwner, repo: iRepo, issue_number: iNumber, milestone: repoMs.number
                });
                console.log(`✅ ${ref}: milestone → ${tag}`);
                updated++;
              } catch (e) {
                console.log(`❌ ${ref}: ${e.message}`);
              }
            }

            console.log(`\n🎉 Done! Updated ${updated} items with milestone "${tag}".`);
