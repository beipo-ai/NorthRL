[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NorthRL"
version = "0.1.0"
description = "An ultra-loosely-coupled LLM post-training framework by Nex-AGI Team"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.2",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
]
authors = [
    {name = "Nex-AGI Team"}
]
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
"Homepage" = "https://github.com/beipo-ai/NorthRL"
"Bug Tracker" = "https://github.com/beipo-ai/NorthRL/issues"

[project.optional-dependencies]
# Full training dependencies
core = [
    "torch==2.7.1",
    "transformers==5.17.0",
    "tokenizers==0.23.2",
    "numpy==1.26.4",
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",

    # HTTP & Communication
    "requests==2.32.3",
    "httpx>=0.28.1",

    # Templates & Data Management
    "pandas>=2.3.1",

    # Weaver SDK integration
    "nex-weaver>=1.19.4",

    # Utilities
    "psutil==6.1.1",
    "pydantic>=2.11.7",

    "nltk==3.9.4",
    "langdetect==1.0.9",
    "sympy==1.13.3",
    "pylatexenc==2.10",
    "reasoning-gym==0.1.25",
    "math-verify==0.9.0",

    "wandb==0.22.3",

    # APIs
    # Keep the sandbox/volume-mount API contract; SDK 2.51 switches to /v2/sandboxes.
    "e2b>=2.50.0,<2.51",
    "openai>=2.14.0",
    "python-dotenv>=1.1.0",
    "urllib3==2.0.7",
]

dev = [
    "black==25.1.0",
    "mypy==1.16.0",
    "isort==6.0.0",
    "pylint==3.3.5",
    "pytest==9.0.2",
]

# SGLang parsers
sglang = [
    "sglang>=0.5.8",
]

# Experiment Tracking
advanced-tracking = [
    "mlflow>=2.0.0",
    "swanlab>=0.3.0",
]

# Docker/runtime defaults: sglang is installed separately to avoid pin conflicts.
docker = [
    "NorthRL[core,dev,advanced-tracking]",
]

# All optional dependencies
all = [
    "NorthRL[core,dev,advanced-tracking,sglang]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["northrl*"]

[tool.setuptools.package-data]
northrl = [
    "config/*.yaml",
    "config/**/*.yaml",
    "remote_rollout/*.sh",
    "rewards/_synlogic/SOURCE.md",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
include = '(\.pyi?$)'
exclude = '''
(
      \.github
    | \.vscode
    | \.venv
    | \.cursor
)
'''
required_version = "25.1.0"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
exclude = ["tests/", "recipe/"]
